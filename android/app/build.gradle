plugins {
    id 'com.android.application'
}

def prop = { String name -> (project.findProperty(name) ?: System.getenv(name.toUpperCase()) ?: '').toString().trim() }
def playGamesAppId = prop('playGamesAppId')
def facebookAppId = prop('facebookAppId')
def facebookClientToken = prop('facebookClientToken')

android {
    namespace 'ae.uaedrive.game'
    compileSdk 35

    defaultConfig {
        applicationId 'ae.uaedrive.game'
        minSdk 24
        targetSdk 35
        versionCode((project.findProperty('versionCode') ?: '1') as int)
        versionName project.findProperty('versionName') ?: '1.0.0'
        resValue 'string', 'game_services_project_id', playGamesAppId ?: '0'
        resValue 'string', 'facebook_app_id', facebookAppId ?: '0'
        resValue 'string', 'facebook_client_token', facebookClientToken ?: '0'
        buildConfigField 'boolean', 'PLAY_GAMES_ENABLED', playGamesAppId ? 'true' : 'false'
        buildConfigField 'boolean', 'FACEBOOK_ENABLED', (facebookAppId && facebookClientToken) ? 'true' : 'false'
        manifestPlaceholders = [facebookScheme: 'fb' + (facebookAppId ?: '0')]
    }

    signingConfigs {
        release {
            def ks = prop('keystoreFile')
            if (ks) {
                storeFile file(ks)
                storePassword prop('keystorePassword')
                keyAlias prop('keyAlias')
                keyPassword prop('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig prop('keystoreFile') ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // the web game is large; keep assets uncompressed for fast loading
    androidResources {
        noCompress += ['wasm']
    }
}

dependencies {
    // align kotlin-stdlib-jdk7/jdk8 pulled in by the Facebook SDK with kotlin-stdlib
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.gms:play-services-games-v2:20.1.2'
    implementation 'com.facebook.android:facebook-login:18.3.0'
}
